                 500.0, 500.0, 500.0,
                 80.0, 80.0, 80.0, 80.0, 80.0, 60.0, 60.0,
                 80.0, 80.0, 80.0, 80.0, 80.0, 60.0, 60.0,
                 300.0, 300.0, 300.0, 300.0, 300.0, 300.0]
    damping:    [5.0, 5.0, 5.0, 5.0, 5.0, 5.0,
                 5.0, 5.0, 5.0,
                 1.5, 1.5, 1.5, 1.5, 1.5, 1.0, 1.0,
                 1.5, 1.5, 1.5, 1.5, 1.5, 1.0, 1.0,
                 5.0, 5.0, 5.0, 5.0, 5.0, 5.0]

  # plan
  pd_plan:
    joint_list: [right_shoulder_pitch_joint, right_shoulder_yaw_joint, right_elbow_pitch_joint]
    init_state: [0.0,   0.0,  0.0]
    stiffness:  [80.0,  80.0, 80.0]
    damping:    [1.5,   1.5,  1.5]
    plan_conf: # plan控制器配置
      trajectory_interpolator: [[0.4, -1.5,  0.0, 1.5],  # trans_time Data1 Data2 Data3
                                [0.8, -1.5,  0.8, 1.5],
                                [0.8, -1.5, -0.8, 1.5],
                                [0.8, -1.5,  0.8, 1.5],
                                [0.8, -1.5, -0.8, 1.5],
                                [0.8, -1.5,  0.8, 1.5],
                                [0.8, -1.5, -0.8, 1.5],
                                [1.0, -1.5,  0.0, 1.5]]

  # walk（29DOF 全身，dof 序与训练一致：左腿6 → 腰3 → 左臂7 → 右臂7 → 右腿6）
  rl_walk_leg:
    joint_list: [left_hip_pitch_joint, left_hip_roll_joint, left_hip_yaw_joint, left_knee_pitch_joint, left_ankle_pitch_joint, left_ankle_roll_joint,
