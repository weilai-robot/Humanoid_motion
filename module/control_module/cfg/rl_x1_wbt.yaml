                right_hip_pitch_joint, right_hip_roll_joint, right_hip_yaw_joint, right_knee_pitch_joint, right_ankle_pitch_joint, right_ankle_roll_joint]
    init_state: [-0.05241, 0.06362, -0.04707, 0.00000, -0.05873, 0.00147,
                 0.00267, 0.04240, 0.03912,
                 0.21269, -0.36005, -0.28457, 0.69806, 0.16050, 0.27075, -0.00039,
