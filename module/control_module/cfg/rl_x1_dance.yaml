# X1 BeyondMimic v11: identified PD, 160 observations, 29 actions.
# Dedicated dance configuration; regular AMP/joystick configurations are independent.
control_frequecy: 1000
use_sim_handles: false
rt_priority: 80
bind_cpu: 6
initial_state: idle
dance_ready_hold_s: 4.0  # Guide 启动准备；ready 条件连续满足 4 秒后自动播放
dance_stand_pose_error: 0.12
sub_joy_vel_name: /cmd_vel_limiter
sub_imu_data_name: /imu/data
sub_joint_state_name: /joint_states
sub_dance_odometry_name: /dance/odometry  # proprioceptive: inspection output; odometry: external input
# The following two topics are only used with state_source: external_topics.
sub_dance_anchor_name: /dance/anchor_pose
sub_dance_base_velocity_name: /dance/base_velocity
sub_actuator_cmd_name: /actuator_cmd
sub_actuator_state_name: /actuator_states
pub_joint_cmd_name: /joint_cmd

robot_states:
  idle:
    trigger_topic: /idle_mode
    pre_states: [keep, zero, stand, dance_ready, dance_x1]
    controllers: [pd_idle]
  keep:
    trigger_topic: /keep_mode
    pre_states: [idle, zero, stand, dance_ready, dance_x1]
    controllers: [pd_keep]
  zero:
    trigger_topic: /zero_mode
    pre_states: [idle, keep, stand, dance_ready, dance_x1]
    controllers: [pd_zero]
  stand:
    trigger_topic: /stand_mode
    pre_states: [zero]
    controllers: [pd_stand]
  dance_ready:
    trigger_topic: /dance_start
    pre_states: [stand]
    controllers: [pd_dance_pose]
  dance_x1:
    trigger_topic: /dance_play
    internal_trigger: true
    pre_states: [dance_ready]
    controllers: [dance_x1]

joint_list:
  - lumbar_yaw_joint
  - lumbar_roll_joint
  - lumbar_pitch_joint
  - left_shoulder_pitch_joint
  - left_shoulder_roll_joint
  - left_shoulder_yaw_joint
  - left_elbow_pitch_joint
  - left_elbow_yaw_joint
  - left_wrist_pitch_joint
  - left_wrist_roll_joint
  - right_shoulder_pitch_joint
  - right_shoulder_roll_joint
  - right_shoulder_yaw_joint
  - right_elbow_pitch_joint
  - right_elbow_yaw_joint
  - right_wrist_pitch_joint
  - right_wrist_roll_joint
  - left_hip_pitch_joint
  - left_hip_roll_joint
  - left_hip_yaw_joint
  - left_knee_pitch_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_hip_pitch_joint
  - right_hip_roll_joint
  - right_hip_yaw_joint
  - right_knee_pitch_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint
# ↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑

