  right_hip_roll_joint:
    lower: -0.2
    upper: 1.5
  right_hip_yaw_joint:
    lower: -1.5
    upper: 1.5
  right_knee_pitch_joint:
    lower: 0
    upper: 2
  right_ankle_pitch_joint:
    lower: -0.41
