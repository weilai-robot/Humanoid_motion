      policy_file: cfg/control_module/policy/rl_walk_leg_15.onnx
      actions_size: 12
      observations_size: 47
      num_hist: 66
      observations_clip: 100.
      actions_clip: 100.
    lpf_conf:
      wc: 100.
      ts: 0.001
      paralle_list:
        - left_ankle_pitch_joint
        - left_ankle_roll_joint
        - right_ankle_pitch_joint
        - right_ankle_roll_joint

  # leg and arm
