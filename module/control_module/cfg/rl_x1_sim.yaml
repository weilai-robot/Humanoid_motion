control_frequecy: 1000
use_sim_handles: True
rt_priority: 80        # rl_control_pub_thread 实时优先级 (SCHED_FIFO)
bind_cpu: 6            # rl_control_pub_thread 绑核
initial_state: stand

sub_joy_vel_name: /cmd_vel_limiter      # controller 接收的运动指令
sub_imu_data_name: /imu/data            # IMU数据
sub_joint_state_name: /joint_states     # 关节数据
sub_actuator_cmd_name: /actuator_cmd    # 电机层指令（需 dcu actuator_debug=true）
sub_actuator_state_name: /actuator_states  # 电机层反馈
pub_joint_cmd_name: /joint_cmd          # 关节控制指令

# ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓ control_modes list ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓
robot_states:
  # 空闲模式 
  idle:
    trigger_topic: /idle_mode
    pre_states: [keep, stand_&_plan, keep_&_plan, walk_leg_&_plan, zero, stand, walk_leg, walk_leg_arm, walk_amp]
    controllers: [pd_idle]
  # keep模式
  keep:
    trigger_topic: /keep_mode
    pre_states: [idle, stand_&_plan, keep_&_plan, wa_&_plan, zero, stand, walk_leg, walk_leg_arm, walk_amp]
    controllers: [pd_keep]

  # 零模式
  zero:
    trigger_topic: /zero_mode
    pre_states: [idle, keep, stand, stand_&_plan]
    controllers: [pd_zero]
  # 站立模式
  stand:
    trigger_topic: /stand_mode
    pre_states: [zero, stand_&_plan, keep_&_plan, walk_leg_&_plan, walk_leg, walk_leg_arm, walk_amp]
    controllers: [pd_zero, pd_stand]

  # 行走模式1
  walk_leg:
    trigger_topic: /walk_mode
    pre_states: [stand_&_plan, walk_leg_&_plan, stand, walk_leg_arm]
    controllers: [pd_zero, pd_stand, rl_walk_leg]
  # 行走模式2
  walk_leg_arm:
    trigger_topic: /walk_mode2
    pre_states: [stand_&_plan, walk_leg_&_plan, stand, walk_leg]
    controllers: [pd_zero, pd_stand, rl_walk_leg_shoulder]

  # AMP全身行走模式（x1_29_AMP soup59c_50，50Hz，29DOF）
  walk_amp:
    trigger_topic: /amp_mode
    pre_states: [stand, stand_&_plan]  # 拒绝 Guide 长按导致 AMP 重入/清历史
    controllers: [pd_zero, pd_stand, rl_walk_amp]

  # plan模式
  stand_&_plan:
    trigger_topic: /plan_mode
    pre_states: [stand, stand_&_plan]
    controllers: [pd_zero, pd_stand, pd_plan]
  keep_&_plan:
    trigger_topic: /plan_mode
    pre_states: [keep, keep_&_plan]
    controllers: [pd_keep, pd_plan]
  walk_leg_&_plan:
    trigger_topic: /plan_mode
    pre_states: [walk_leg, walk_leg_&_plan]
    controllers: [pd_zero, pd_stand, rl_walk_leg, pd_plan]
