freq: 20   # 数据发布频率，单位：Hz

# IMU 订阅话题（用于 RT 偏航闭环）
sub_imu_topic: /imu/data

# RT 直线行走参数（按 RT 键开关，IMU 偏航闭环纠正）
rt_auto_walk:
  enabled: true
  linear_x: 0.4           # 前进速度 m/s
  linear_y: -0.05           # 侧向补偿 m/s（正=向右，负=向左，0=无补偿）
  yaw_kp: 1.2             # 偏航 P 增益
  yaw_ki: 0.5             # 偏航 I 增益（消除稳态误差）
  yaw_kd: 0.3             # 偏航 D 增益（阻尼）
  max_angular_z: 0.6      # 最大转弯角速度 rad/s 限幅
  i_limit: 0.5            # 积分项限幅 rad/s（防饱和）

float_pubs:
  - topic_name: /idle_mode
    buttons: [7]
  - topic_name: /zero_mode
    buttons: [1]
  - topic_name: /stand_mode
    buttons: [0]
  - topic_name: /walk_mode
    buttons: [2]
  - topic_name: /walk_mode2
    buttons: [3]
  # AMP 全身行走: 须从 stand 进入(stand_mode 键站稳后按);
  # 小脑侧有 AmpReady 入口检查(关节/IMU 反馈新鲜), 反馈异常时按键无效
  - topic_name: /amp_mode
    buttons: [8]   # Guide/大圆键; 若手柄不报 8 号键(部分蓝牙驱动), 改 9 或 10(摇杆下压)
  - topic_name: /keep_mode
    buttons: [6]
  - topic_name: /plan_mode
    buttons: [5]

# Twist twist
#         Vector3  linear
#                 float64 x
#                 float64 y
#                 float64 z
#         Vector3  angular
#                 float64 x
#                 float64 y
#                 float64 z
twist_pubs:
  - topic_name: /cmd_vel
    buttons: [4]
    axis:
      linear-x: 1
      linear-y: 0
      angular-z: 3
    # twist的线速度和角速度限制
    # AMP 训练范围为 vx[-0.5,2.5] vy[-0.5,0.5] wz[-1.5,1.5]（小脑侧二次限幅兜底）;
    # 吊架/首测阶段保持保守限幅, 地面验证通过后再按需放宽 ub[0]
    velocity_limit_lb: [-0.5, -0.3, -0.5]
    velocity_limit_ub: [0.5, 0.3, 0.5]
    # 固定速度（可选）：设置后忽略摇杆轴，使用以下固定值行走
    # 单位：linear m/s，angular rad/s；删除或注释此段恢复摇杆控制
    # ⚠️ 使用 Nav2 导航时必须注释掉 constant_velocity，否则手柄会持续抢占 /cmd_vel_limiter

#######################    小脑行走测试：   #######################
    # 小脑行走测试：
    # 已注释: 固速 0.4 直行会忽略摇杆轴, 且持续抢占 /cmd_vel_limiter;
    # AMP 手柄操作需摇杆控制, 恢复固定速度测试时再解开
