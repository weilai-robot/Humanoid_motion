freq: 20   # 数据发布频率，单位：Hz

# IMU 订阅话题（用于 RT 偏航闭环）
sub_imu_topic: /imu/data

# RT 直线行走参数（按 RT 键开关，IMU 偏航闭环纠正）
rt_auto_walk:
  enabled: true
  linear_x: 0.4           # 前进速度 m/s
  yaw_kp: 0.8             # 偏航 P 增益
  yaw_ki: 0.3             # 偏航 I 增益（消除稳态误差）
  yaw_kd: 0.2             # 偏航 D 增益（阻尼）
  max_angular_z: 0.5      # 最大转弯角速度 rad/s 限幅
  i_limit: 0.3            # 积分项限幅 rad/s（防饱和）

float_pubs:
  - topic_name: /idle_mode
    buttons: [7]
  - topic_name: /zero_mode
    buttons: [1]
  - topic_name: /stand_mode
    buttons: [0]
  - topic_name: /walk_mode
    buttons: [2]
  - topic_name: /walk_mode2
    buttons: [3]
  - topic_name: /keep_mode
    buttons: [6]
  - topic_name: /plan_mode
    buttons: [5]

# Twist twist
#         Vector3  linear
#                 float64 x
#                 float64 y
#                 float64 z
#         Vector3  angular
#                 float64 x
#                 float64 y
#                 float64 z
twist_pubs:
  - topic_name: /cmd_vel
    buttons: [4]
    axis:
      linear-x: 1
      linear-y: 0
      angular-z: 3
    # twist的线速度和角速度限制
    velocity_limit_lb: [-0.5, -0.3, -0.5]
    velocity_limit_ub: [0.5, 0.3, 0.5]
    # 固定速度（可选）：设置后忽略摇杆轴，使用以下固定值行走
    # 单位：linear m/s，angular rad/s；删除或注释此段恢复摇杆控制
    # ⚠️ 使用 Nav2 导航时必须注释掉 constant_velocity，否则手柄会持续抢占 /cmd_vel_limiter
    constant_velocity:
      linear-x: 0.4
      linear-y: 0.0
      angular-z: 0.0

