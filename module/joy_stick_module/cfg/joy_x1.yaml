#######################    AMP 手柄操作：   #######################
# 进入:  zero(B) → stand(A) 站稳 → Guide(8) 进 AMP → 保持零速 ≥1s(软启动)
# 控制:  按住 LB(4) + 左摇杆(前后=前进后退, 左右=平移), 右摇杆左右=转向
# 退出:  A(0)=stand_mode 或 Back(6)=keep_mode, AMP 内两者立即生效(无 1s 节流)
# 安全:  松开 LB 后 /cmd_vel_limiter 停发, 小脑 250ms 超时自动归零(等效死区);
#        反馈断流/倾角超限/推理异常时小脑自动切 keep, 物理急停始终独立可用
# ⚠ RT(右扳机)在 AMP 模式下不会切换状态(walk_leg 不接受 walk_amp 前置),
#   但其 IMU 闭环速度(0.4m/s 前进)仍会绕过 LB 发布 —— AMP 中勿按 RT;
#   误按后可用 LT(左扳机)触发 5s 匀减速刹停(结束自动回 stand)
