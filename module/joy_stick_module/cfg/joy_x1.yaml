freq: 20   # 数据发布频率，单位：Hz

# IMU 订阅话题（用于 RT 偏航闭环）
sub_imu_topic: /imu/data

# RT 直线行走参数（按 RT 键开关，IMU 偏航闭环纠正）
rt_auto_walk:
  enabled: true
  linear_x: 0.4           # 前进速度 m/s
  linear_y: -0.05           # 侧向补偿 m/s（正=向右，负=向左，0=无补偿）
  yaw_kp: 1.2             # 偏航 P 增益
  yaw_ki: 0.5             # 偏航 I 增益（消除稳态误差）
  yaw_kd: 0.3             # 偏航 D 增益（阻尼）
  max_angular_z: 0.6      # 最大转弯角速度 rad/s 限幅
  i_limit: 0.5            # 积分项限幅 rad/s（防饱和）

float_pubs:
  - topic_name: /idle_mode
    buttons: [7]
  - topic_name: /zero_mode
    buttons: [1]
  - topic_name: /stand_mode
    buttons: [0]
  - topic_name: /walk_mode
    buttons: [2]
  - topic_name: /walk_mode2
    buttons: [3]
  - topic_name: /keep_mode
    buttons: [6]
  - topic_name: /plan_mode
    buttons: [5]

# Twist twist
#         Vector3  linear
#                 float64 x
#                 float64 y
#                 float64 z
#         Vector3  angular
#                 float64 x
#                 float64 y
#                 float64 z
twist_pubs:
  - topic_name: /cmd_vel
    buttons: [4]
    axis:
      linear-x: 1
      linear-y: 0
      angular-z: 3
    # twist的线速度和角速度限制
    velocity_limit_lb: [-0.5, -0.3, -0.5]
    velocity_limit_ub: [0.5, 0.3, 0.5]
    # 固定速度（可选）：设置后忽略摇杆轴，使用以下固定值行走
    # 单位：linear m/s，angular rad/s；删除或注释此段恢复摇杆控制
    # ⚠️ 使用 Nav2 导航时必须注释掉 constant_velocity，否则手柄会持续抢占 /cmd_vel_limiter

#######################    摇杆档位模式（每轴一档）：   #######################
    # 摇杆=档位选择器不是油门：推过阈值输出固定速度，回中输出 0。
    # 动机：连续比例映射下手劲抖动=速度噪声（v5 真机验证的稳定域窄，cmd 抖 ±0.1 即域内大幅波动；
    # yaw_hold 门控 0.15 也会被摇杆小抖动反复触发边沿 recenter）。
    # 档位值全部在 v5_7500 已真机验证的安全域内：x 0.25（前向15s稳走）/ y 0.15 / wz 0.2（跟踪98%）。
    # ⚠️ x 负向未训练（lin_vel_x=[0.1,0.4] 无负样本）→ x_neg_scale=0：向后推无响应，倒退需"转弯180°+前进"替代，
    #    负向训练列 v6 里程碑。y/z 双向均已训练（[−0.4,0.4]/[−0.6,0.6]）。
    # 死区 0.2：吞掉回中附近抖动；x_neg_scale/y_neg_scale/z_neg_scale 缩放负向档位（0=禁用该方向）。
    # 恢复连续比例控制：注释掉整个 gear_mode 段
    gear_mode:
      enabled: true
      deadzone: 0.2
      x_scale: 0.25
      x_neg_scale: 0.0
      y_scale: 0.15
      y_neg_scale: 0.15
      z_scale: 0.2
      z_neg_scale: 0.2
#######################    小脑行走测试（已由 gear_mode 取代，保留作对照基线）：   #######################
    # 小脑行走测试（固定速度直行，20260824 v5 真机三速度验证通道；恢复用：取消注释并注释 gear_mode）
    # constant_velocity:
    #   linear-x: 0.25
    #   linear-y: 0.0
    #   angular-z: 0.0
