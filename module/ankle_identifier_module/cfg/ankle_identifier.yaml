joint_cmd_topic: /joint_cmd
joint_state_topic: /joint_states
imu_topic: /imu/data
reference_control_cfg_path: ./cfg/control_module/rl_x1.yaml

mode: step
startup_pose_mode: zero
test_side: left
test_axis: roll

publish_rate_hz: 1000.0
pre_hold_sec: 2.0
active_sec: 1.0
post_hold_sec: 2.0
repeat_count: 3

step_amplitude_rad: 0.015
sine_amplitude_rad: 0.004
sine_frequency_hz: 1

test_kp: 30
test_kd: 0.5
hold_kp: 30.0
hold_kd: 1.0
torso_hold_kp: 500.0
torso_hold_kd: 5.0
arm_hold_kp: 80.0
arm_hold_kd: 1.5
leg_hold_kp: 300.0
leg_hold_kd: 5.0
startup_stable_sec: 1.0
startup_joint_vel_threshold: 0.05
startup_gyro_threshold: 0.2

use_imu: true
auto_stop_after_test: true
csv_path: ./log/left_roll_step_air_kp30_kd0.5_r2a.csv
