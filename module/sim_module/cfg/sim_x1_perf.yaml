# 运动控制基础性能测试配置 — 用于 scripts/run_loco_perf.sh
# 与 sim_x1.yaml 的区别:
#   1. 平地场景 (flat) + 显式发布 base pose / ground truth
#      (位置/姿态/碰撞/RTF, 供性能指标计算: 达成率/偏移率/停止时间)
#   2. 用于 vx/vy/wz 指令扫描测试 (直线/原地转弯/弧线/停止)
model_file: cfg/sim_module/model/mjcf/xyber_x1_flat.xml
render_frequecy: 50      # 数据发布频率

sub_reset_sim_topic: /reset_sim
sub_joint_cmd_topic: /joint_cmd
pub_imu_data_topic: /imu/data
pub_joint_state_topic: /joint_states

# 性能测试需要: ground truth (含 x,y 位置) + base pose
pub_base_pose_topic: /mujoco/base_pose
pub_ground_truth_topic: /mujoco/ground_truth
