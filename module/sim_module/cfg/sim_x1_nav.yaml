# Navigation sim config — 用于 run_sim_nav.sh
# 与 sim_x1.yaml 的区别:
#   1. 加载 nav 场景 (lab_env 实验室环境, 有墙壁/障碍物)
#   2. 新增 lidar IMU + base pose 发布 (供 LiDAR bridge + FastLIO2)
model_file: cfg/sim_module/model/mjcf/xyber_x1_nav.xml
render_frequecy: 50      # 数据发布频率

sub_reset_sim_topic: /reset_sim
sub_joint_cmd_topic: /joint_cmd
pub_imu_data_topic: /imu/data
pub_joint_state_topic: /joint_states

# Navigation sim: lidar IMU + base pose (for LiDAR bridge + FastLIO2)
pub_lidar_imu_topic: /livox/imu
pub_base_pose_topic: /mujoco/base_pose
pub_ground_truth_topic: /mujoco/ground_truth
