# ============================================================
# x1_cfg_dance.yaml — X1 BeyondMimic 舞蹈吊架联调专用
# 不加载手柄。/dance/anchor_pose 和 /dance/base_velocity 必须由经验证的
# 状态估计器提供；缺失时 /dance_mode 会被拒绝。
# 启动: cd build && bash ./run_dance.sh
# ============================================================
aimrt:
  plugin:
    plugins:
      - name: ros2_plugin
        path: ./libaimrt_ros2_plugin.so
        options:
          node_name: x1_dance_ctrl_node
          executor_type: MultiThreaded # SingleThreaded/StaticSingleThreaded/MultiThreaded
          executor_thread_num: 4
  log: # 日志配置
    core_lvl: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console # 控制台
      - type: rotate_file # 文件
        options:
          path: ./log
          filename: x1_rl_ctrl_dance.log
          max_file_size_m: 4
          max_file_num: 10
  executor: # 执行器配置
    executors:
      - name: rl_control_pub_thread # 创建一个单线程执行器
        type: simple_thread
      # 注: joy_stick_pub_thread 已移除（JoyStickModule 未加载, 无任何引用）
  channel: # 消息队列相关配置
    backends: # 消息队列后端配置
      - type: local
      - type: ros2
    pub_topics_options: # 为 publish topic 选择后端
      - topic_name: "(.*)"
        enable_backends: [local, ros2]
    sub_topics_options: # 为 subscribe topic 选择后端
      - topic_name: "/(idle_mode|zero_mode|stand_mode|keep_mode|dance_mode|dance/anchor_pose|dance/base_velocity)"
        enable_backends: [local, ros2]
      - topic_name: "(.*)"
        enable_backends: [local]
  rpc: # rpc相关配置
    backends: # rpc后端配置
      - type: local
      - type: ros2
    clients_options: # 为 client 选择后端
      - func_name: "(.*)"
        enable_backends: [local]
    servers_options: # 为 server 选择后端
      - func_name: "(.*)"
        enable_backends: [local, ros2]
  module: # 模块配置
    pkgs: # 要加载的动态库配置
      - path: ./libpkg1.so
        enable_modules:
          # JoyStickModule 不加载；舞蹈状态与导航速度源隔离
          - ControlModule
          - DcuDriverModule
    modules: # 模块
      - name: ControlModule
        log_lvl: INFO
        cfg_file_path: ./cfg/control_module/rl_x1.yaml
      - name: DcuDriverModule
        log_lvl: WARN
        cfg_file_path: ./cfg/dcu_driver_module/dcu_x1.yaml
