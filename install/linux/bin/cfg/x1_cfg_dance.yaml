# ============================================================
# x1_cfg_dance.yaml — X1 BeyondMimic 舞蹈吊架联调专用
# 三键：A=zero，B=stand，Guide=准备位 -> 自动播放。
# 默认 v12 154维：IMU 姿态/角速度 + 关节编码器，按源时间计算腰部姿态。
# 不依赖身体位置/线速度估计器，不发布 /dance/odometry；保留完整状态模式的路由。
# 播放结束自动减速/落脚并验证站立；收尾需要有效关节力矩反馈。无需 Python 或导航里程计。
# 启动: cd build && bash ./run_dance.sh
# ============================================================
aimrt:
  plugin:
    plugins:
      - name: ros2_plugin
        path: ./libaimrt_ros2_plugin.so
        options:
          node_name: x1_dance_ctrl_node
          executor_type: MultiThreaded # SingleThreaded/StaticSingleThreaded/MultiThreaded
          executor_thread_num: 4
  log: # 日志配置
    core_lvl: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console # 控制台
      - type: rotate_file # 文件
        options:
          path: ./log
          filename: x1_rl_ctrl_dance.log
          max_file_size_m: 4
          max_file_num: 10
  executor: # 执行器配置
    executors:
      - name: rl_control_pub_thread # 创建一个单线程执行器
        type: simple_thread
      - name: joy_stick_pub_thread
        type: simple_thread
  channel: # 消息队列相关配置
    backends: # 消息队列后端配置
      - type: local
      - type: ros2
        options:
          sub_topics_options:
            - topic_name: "/dance/odometry"
              qos:
                history: keep_last
                depth: 5
                reliability: best_effort
                durability: volatile
    pub_topics_options: # 为 publish topic 选择后端
      - topic_name: "(.*)"
        enable_backends: [local, ros2]
    sub_topics_options: # 为 subscribe topic 选择后端
      - topic_name: "/(idle_mode|zero_mode|stand_mode|keep_mode|dance_start|dance/odometry|dance/anchor_pose|dance/base_velocity)"
        enable_backends: [local, ros2]
      - topic_name: "(.*)"
        enable_backends: [local]
  rpc: # rpc相关配置
    backends: # rpc后端配置
      - type: local
      - type: ros2
    clients_options: # 为 client 选择后端
      - func_name: "(.*)"
        enable_backends: [local]
    servers_options: # 为 server 选择后端
      - func_name: "(.*)"
        enable_backends: [local, ros2]
  module: # 模块配置
    pkgs: # 要加载的动态库配置
      - path: ./libpkg1.so
        enable_modules:
          - JoyStickModule
          - ControlModule
          - DcuDriverModule
    modules: # 模块
      - name: JoyStickModule
        log_lvl: INFO
        cfg_file_path: ./cfg/joy_stick_module/joy_x1_dance.yaml
      - name: ControlModule
        log_lvl: INFO
        cfg_file_path: ./cfg/control_module/rl_x1_dance.yaml
      - name: DcuDriverModule
        log_lvl: WARN
        cfg_file_path: ./cfg/dcu_driver_module/dcu_x1.yaml
